<html vid="0"><head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <title vid="4">Programming Jam 2026 - Team Formation</title>
    <script src="https://cdn.tailwindcss.com/3.4.17" vid="5"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" vid="6">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" vid="7">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Space+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet" vid="8">
    <script src="https://unpkg.com/@phosphor-icons/web" vid="9"></script>
    
    <script vid="10">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgLight: '#F7F7F2',
                        textDark: '#111111',
                        brandPurple: '#6C4DFF',
                        brandTeal: '#00C2A8',
                        brandOrange: '#FF5C35'
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    animation: {
                        'marquee': 'marquee 20s linear infinite',
                        'blink': 'blink 1s step-end infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        },
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(5deg)' }
                        }
                    }
                }
            }
        }
    </script>
    <style vid="11">
        body {
            background-color: #F7F7F2;
            color: #111111;
            overflow: hidden;
        }
        .shadow-brutal-purple { box-shadow: 6px 6px 0px 0px #6C4DFF; }
        .shadow-brutal-teal { box-shadow: 6px 6px 0px 0px #00C2A8; }
        .shadow-brutal-orange { box-shadow: 6px 6px 0px 0px #FF5C35; }
        .shadow-brutal-dark { box-shadow: 8px 8px 0px 0px #111111; }
        
        .custom-checkbox:checked + label {
            background-color: #6C4DFF;
            color: white;
            border-color: #111111;
        }

        .modal-blur {
            backdrop-filter: blur(8px);
            background-color: rgba(247, 247, 242, 0.8);
        }
    </style>
</head>
<body class="font-sans antialiased" vid="12">

    
    <div class="fixed inset-0 z-0 opacity-50" vid="13">
        <nav class="w-full bg-bgLight border-b-4 border-textDark" vid="14">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between" vid="15">
                <div class="font-bold text-2xl tracking-tighter flex items-center gap-2" vid="16">
                    <span class="w-6 h-6 bg-brandPurple border-2 border-textDark inline-block" vid="17"></span> JAM.26
                </div>
            </div>
        </nav>
        <div class="p-20 flex flex-col items-center" vid="18">
            <div class="w-[800px] h-[400px] border-4 border-textDark bg-white shadow-brutal-purple" vid="19"></div>
        </div>
    </div>

    
    <div class="fixed inset-0 z-50 flex items-center justify-center modal-blur p-6" vid="20">
        
        
        <div class="w-full max-w-2xl bg-white border-4 border-textDark shadow-brutal-dark relative animate-[scale_0.3s_ease-out]" vid="21">
            
            
            <div class="h-14 border-b-4 border-textDark bg-textDark flex items-center px-4 justify-between" vid="22">
                <div class="flex items-center gap-3" vid="23">
                    <div class="w-3 h-3 rounded-full bg-brandOrange border border-white" vid="24"></div>
                    <span class="text-white font-mono text-sm font-bold uppercase tracking-widest" vid="25">Team_Formation_Protocol.exe</span>
                </div>
                <button class="text-white hover:text-brandOrange transition-colors" vid="26">
                    <i class="ph ph-x-square text-3xl" vid="27"></i>
                </button>
            </div>

            
            <div class="p-8 md:p-10" vid="28">
                
                <div class="mb-10" vid="29">
                    <h2 class="text-4xl font-bold uppercase tracking-tighter mb-2" vid="30">Assemble Your <span class="text-brandPurple" vid="31">Squad</span></h2>
                    <p class="font-mono text-sm text-gray-500" vid="32">&gt; Initializing collaborative workspace... Awaiting metadata.</p>
                </div>

                <form class="space-y-8" vid="33">
                    
                    <div class="space-y-2" vid="34">
                        <label class="block font-mono text-xs font-bold uppercase text-gray-500" vid="35">01 // Squad Name</label>
                        <input type="text" placeholder="e.g. NULL_POINTERS" class="w-full border-4 border-textDark p-4 font-mono focus:outline-none focus:bg-brandPurple/5 focus:border-brandPurple transition-colors shadow-brutal-teal" vid="36">
                    </div>

                    
                    <div class="space-y-2" vid="37">
                        <label class="block font-mono text-xs font-bold uppercase text-gray-500" vid="38">02 // Recruit Members (Emails)</label>
                        <div class="w-full border-4 border-textDark p-3 flex flex-wrap gap-2 min-h-[64px]" vid="39">
                            <span class="bg-brandTeal text-textDark font-bold font-mono text-xs px-3 py-1 border-2 border-textDark flex items-center gap-2" vid="40">
                                alice@kernel.org <i class="ph ph-x cursor-pointer hover:text-white" vid="41"></i>
                            </span>
                            <span class="bg-brandPurple text-white font-bold font-mono text-xs px-3 py-1 border-2 border-textDark flex items-center gap-2" vid="42">
                                bob@sys.admin <i class="ph ph-x cursor-pointer hover:text-brandTeal" vid="43"></i>
                            </span>
                            <input type="email" placeholder="Type email and enter..." class="flex-1 min-w-[150px] font-mono text-sm focus:outline-none" vid="44">
                        </div>
                    </div>

                    
                    <div class="space-y-4" vid="45">
                        <label class="block font-mono text-xs font-bold uppercase text-gray-500" vid="46">03 // Primary Battleground (Stack)</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3" vid="47">
                            <div vid="48">
                                <input type="checkbox" id="stack-rust" class="hidden custom-checkbox" vid="49">
                                <label for="stack-rust" class="flex items-center justify-center border-2 border-textDark p-3 font-mono text-xs font-bold cursor-pointer hover:bg-gray-100 transition-all uppercase" vid="50">Rust</label>
                            </div>
                            <div vid="51">
                                <input type="checkbox" id="stack-ts" class="hidden custom-checkbox" checked="" vid="52">
                                <label for="stack-ts" class="flex items-center justify-center border-2 border-textDark p-3 font-mono text-xs font-bold cursor-pointer hover:bg-gray-100 transition-all uppercase" vid="53">TypeScript</label>
                            </div>
                            <div vid="54">
                                <input type="checkbox" id="stack-py" class="hidden custom-checkbox" vid="55">
                                <label for="stack-py" class="flex items-center justify-center border-2 border-textDark p-3 font-mono text-xs font-bold cursor-pointer hover:bg-gray-100 transition-all uppercase" vid="56">Python</label>
                            </div>
                            <div vid="57">
                                <input type="checkbox" id="stack-go" class="hidden custom-checkbox" vid="58">
                                <label for="stack-go" class="flex items-center justify-center border-2 border-textDark p-3 font-mono text-xs font-bold cursor-pointer hover:bg-gray-100 transition-all uppercase" vid="59">GoLang</label>
                            </div>
                        </div>
                    </div>

                    
                    <div class="flex flex-col sm:flex-row gap-4 pt-4" vid="60">
                        <button type="submit" class="flex-1 bg-brandOrange text-white font-bold py-4 border-4 border-textDark shadow-brutal-dark hover:-translate-y-1 hover:shadow-[12px_12px_0px_0px_#111111] transition-all flex items-center justify-center gap-3 text-lg" vid="61">
                            INITIATE FORMATION <i class="ph-bold ph-users-three" vid="62"></i>
                        </button>
                        <button type="button" class="px-8 py-4 bg-white border-4 border-textDark font-bold hover:bg-gray-100 transition-colors" vid="63">
                            CANCEL
                        </button>
                    </div>
                </form>
            </div>

            
            <div class="bg-brandTeal border-t-4 border-textDark py-2 overflow-hidden flex" vid="64">
                <div class="flex whitespace-nowrap animate-marquee font-mono text-[10px] font-bold uppercase tracking-widest text-textDark" vid="65">
                    <span class="mx-4" vid="66">System Online</span>
                    <span class="mx-4" vid="67">//</span>
                    <span class="mx-4" vid="68">Ready for Deployment</span>
                    <span class="mx-4" vid="69">//</span>
                    <span class="mx-4" vid="70">Form Teams Wisely</span>
                    <span class="mx-4" vid="71">//</span>
                    <span class="mx-4" vid="72">System Online</span>
                    <span class="mx-4" vid="73">//</span>
                    <span class="mx-4" vid="74">Ready for Deployment</span>
                    <span class="mx-4" vid="75">//</span>
                </div>
            </div>
        </div>

        
        <div class="absolute top-[10%] right-[10%] text-brandOrange/20 font-mono text-9xl font-bold select-none pointer-events-none animate-float" vid="76">
            
        </div>
        <div class="absolute bottom-[10%] left-[5%] text-brandPurple/20 font-mono text-8xl font-bold select-none pointer-events-none" style="animation: float 8s ease-in-out infinite" vid="77">
            #
        </div>

    </div>


</body></html>
