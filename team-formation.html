<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Jam 2026 - Team Formation</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Space+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgLight: '#F7F7F2',
                        textDark: '#111111',
                        brandPurple: '#6C4DFF',
                        brandTeal: '#00C2A8',
                        brandOrange: '#FF5C35'
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    animation: {
                        'marquee': 'marquee 20s linear infinite',
                        'blink': 'blink 1s step-end infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        },
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(5deg)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F7F7F2;
            color: #111111;
            overflow: hidden;
        }
        .shadow-brutal-purple { box-shadow: 6px 6px 0px 0px #6C4DFF; }
        .shadow-brutal-teal { box-shadow: 6px 6px 0px 0px #00C2A8; }
        .shadow-brutal-orange { box-shadow: 6px 6px 0px 0px #FF5C35; }
        .shadow-brutal-dark { box-shadow: 8px 8px 0px 0px #111111; }
        
        .custom-checkbox:checked + label {
            background-color: #6C4DFF;
            color: white;
            border-color: #111111;
        }

        .modal-blur {
            backdrop-filter: blur(8px);
            background-color: rgba(247, 247, 242, 0.8);
        }
    </style>
</head>
<body class="font-sans antialiased">

    
    <div class="fixed inset-0 z-0 opacity-50">
        <nav class="w-full bg-bgLight border-b-4 border-textDark">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                <div class="font-bold text-2xl tracking-tighter flex items-center gap-2">
                    <span class="w-6 h-6 bg-brandPurple border-2 border-textDark inline-block"></span> JAM.26
                </div>
            </div>
        </nav>
        <div class="p-20 flex flex-col items-center">
            <div class="w-[800px] h-[400px] border-4 border-textDark bg-white shadow-brutal-purple"></div>
        </div>
    </div>

    
    <div class="fixed inset-0 z-50 flex items-center justify-center modal-blur p-6">
        
        
        <div class="w-full max-w-2xl bg-white border-4 border-textDark shadow-brutal-dark relative animate-[scale_0.3s_ease-out]">
            
            
            <div class="h-14 border-b-4 border-textDark bg-textDark flex items-center px-4 justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-brandOrange border border-white"></div>
                    <span class="text-white font-mono text-sm font-bold uppercase tracking-widest">Team_Formation_Protocol.exe</span>
                </div>
                <a href="index.html" class="text-white hover:text-brandOrange transition-colors">
                    <i class="ph ph-x-square text-3xl"></i>
                </a>
            </div>

            
            <div class="p-8 md:p-10">
                
                <div class="mb-10">
                    <h2 class="text-4xl font-bold uppercase tracking-tighter mb-2">Assemble Your <span class="text-brandPurple">Squad</span></h2>
                    <p class="font-mono text-sm text-gray-500">&gt; Initializing collaborative workspace... Awaiting metadata.</p>
                </div>

                <form class="space-y-8">
                    
                    <div class="space-y-2">
                        <label class="block font-mono text-xs font-bold uppercase text-gray-500">01 // Squad Name</label>
                        <input type="text" placeholder="e.g. NULL_POINTERS" class="w-full border-4 border-textDark p-4 font-mono focus:outline-none focus:bg-brandPurple/5 focus:border-brandPurple transition-colors shadow-brutal-teal">
                    </div>

                    
                    <div class="space-y-2">
                        <label class="block font-mono text-xs font-bold uppercase text-gray-500">02 // Recruit Members (Emails)</label>
                        <div class="w-full border-4 border-textDark p-3 flex flex-wrap gap-2 min-h-[64px]">
                            <span class="bg-brandTeal text-textDark font-bold font-mono text-xs px-3 py-1 border-2 border-textDark flex items-center gap-2">
                                alice@kernel.org <i class="ph ph-x cursor-pointer hover:text-white"></i>
                            </span>
                            <span class="bg-brandPurple text-white font-bold font-mono text-xs px-3 py-1 border-2 border-textDark flex items-center gap-2">
                                bob@sys.admin <i class="ph ph-x cursor-pointer hover:text-brandTeal"></i>
                            </span>
                            <input type="email" placeholder="Type email and enter..." class="flex-1 min-w-[150px] font-mono text-sm focus:outline-none">
                        </div>
                    </div>

                    
                    <div class="space-y-4">
                        <label class="block font-mono text-xs font-bold uppercase text-gray-500">03 // Primary Battleground (Stack)</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div>
                                <input type="checkbox" id="stack-rust" class="hidden custom-checkbox">
                                <label for="stack-rust" class="flex items-center justify-center border-2 border-textDark p-3 font-mono text-xs font-bold cursor-pointer hover:bg-gray-100 transition-all uppercase">Rust</label>
                            </div>
                            <div>
                                <input type="checkbox" id="stack-ts" class="hidden custom-checkbox" checked="">
                                <label for="stack-ts" class="flex items-center justify-center border-2 border-textDark p-3 font-mono text-xs font-bold cursor-pointer hover:bg-gray-100 transition-all uppercase">TypeScript</label>
                            </div>
                            <div>
                                <input type="checkbox" id="stack-py" class="hidden custom-checkbox">
                                <label for="stack-py" class="flex items-center justify-center border-2 border-textDark p-3 font-mono text-xs font-bold cursor-pointer hover:bg-gray-100 transition-all uppercase">Python</label>
                            </div>
                            <div>
                                <input type="checkbox" id="stack-go" class="hidden custom-checkbox">
                                <label for="stack-go" class="flex items-center justify-center border-2 border-textDark p-3 font-mono text-xs font-bold cursor-pointer hover:bg-gray-100 transition-all uppercase">GoLang</label>
                            </div>
                        </div>
                    </div>

                    
                    <div class="flex flex-col sm:flex-row gap-4 pt-4">
                        <button type="submit" class="flex-1 bg-brandOrange text-white font-bold py-4 border-4 border-textDark shadow-brutal-dark hover:-translate-y-1 hover:shadow-[12px_12px_0px_0px_#111111] transition-all flex items-center justify-center gap-3 text-lg">
                            INITIATE FORMATION <i class="ph-bold ph-users-three"></i>
                        </button>
                        <a href="index.html" class="px-8 py-4 bg-white border-4 border-textDark font-bold hover:bg-gray-100 transition-colors text-center">
                            CANCEL
                        </a>
                    </div>
                </form>
            </div>

            
            <div class="bg-brandTeal border-t-4 border-textDark py-2 overflow-hidden flex">
                <div class="flex whitespace-nowrap animate-marquee font-mono text-[10px] font-bold uppercase tracking-widest text-textDark">
                    <span class="mx-4">System Online</span>
                    <span class="mx-4">//</span>
                    <span class="mx-4">Ready for Deployment</span>
                    <span class="mx-4">//</span>
                    <span class="mx-4">Form Teams Wisely</span>
                    <span class="mx-4">//</span>
                    <span class="mx-4">System Online</span>
                    <span class="mx-4">//</span>
                    <span class="mx-4">Ready for Deployment</span>
                    <span class="mx-4">//</span>
                </div>
            </div>
        </div>

        
        <div class="absolute top-[10%] right-[10%] text-brandOrange/20 font-mono text-9xl font-bold select-none pointer-events-none animate-float">
            
        </div>
        <div class="absolute bottom-[10%] left-[5%] text-brandPurple/20 font-mono text-8xl font-bold select-none pointer-events-none" style="animation: float 8s ease-in-out infinite">
            #
        </div>

    </div>


</body></html>
